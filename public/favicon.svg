<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="qn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Vibrant Quantum Arc Gradient -->
    <linearGradient id="qn-ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Alpha Arrow Glow Gradient -->
    <linearGradient id="qn-arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Filter for Subtle Ambient Depth -->
    <filter id="qn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Container with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#qn-bg)" />

  <!-- Subtle Precision Geometric Quant Grid Line -->
  <circle cx="240" cy="240" r="148" fill="none" stroke="#6366F1" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6" />

  <!-- Main Q Ring: Dynamic Unbroken Precision Torus -->
  <path
    d="M 240 88
       A 152 152 0 1 0 348 348
       A 152 152 0 0 0 392 240
       A 152 152 0 0 0 240 88 Z"
    fill="none"
    stroke="url(#qn-ring-grad)"
    stroke-width="36"
    stroke-linecap="round"
    filter="url(#qn-glow)"
  />

  <!-- Ascending Alpha Trend Vector (Q Tail + Outperformance Spear) -->
  <path
    d="M 285 285 L 430 430"
    fill="none"
    stroke="url(#qn-arrow-grad)"
    stroke-width="38"
    stroke-linecap="round"
  />

  <!-- Precision Arrowhead pointing to Top-Right Outperformance -->
  <path
    d="M 360 430 L 430 430 L 430 360"
    fill="none"
    stroke="url(#qn-arrow-grad)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Quantum Spark / Core Regime Node -->
  <circle cx="240" cy="240" r="28" fill="#10B981" />
  <circle cx="240" cy="240" r="14" fill="#FFFFFF" />

  <!-- Dynamic Factor Wave Arc Inside Q -->
  <path
    d="M 160 255 Q 200 210 240 240 T 320 225"
    fill="none"
    stroke="#A78BFA"
    stroke-width="12"
    stroke-linecap="round"
    stroke-opacity="0.8"
  />
</svg>
