[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jayaditya Dev", email = "jayadityadev261204@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.1.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.15.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.0.38",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.6.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

