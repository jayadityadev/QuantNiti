<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="qn-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="qn-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="118" fill="url(#qn-bg-grad)" filter="url(#shadow)" />

  <!-- Background Subtle Grid / Quant Geometry -->
  <path d="M96 256 H416 M256 96 V416" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" />

  <!-- Modern QuantNiti 'Q' & Alpha Trajectory -->
  <!-- Outer Q-ring -->
  <circle cx="240" cy="235" r="105" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
  
  <!-- Candlestick / Factor Trend Rising inside Q -->
  <line x1="205" y1="210" x2="205" y2="280" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <rect x="197" y="225" width="16" height="35" rx="4" fill="#38BDF8" />

  <line x1="240" y1="175" x2="240" y2="265" stroke="#A78BFA" stroke-width="12" stroke-linecap="round" />
  <rect x="232" y="195" width="16" height="45" rx="4" fill="#A78BFA" />

  <!-- Dynamic Q-tail as Breakthrough Growth Arrow -->
  <path d="M295 295 L395 395 M395 330 L395 395 L330 395" 
        fill="none" stroke="url(#qn-glow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Quantum Pulse Dot -->
  <circle cx="395" cy="395" r="8" fill="#FFFFFF" />
</svg>
