name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile QuantNiti Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_URL: https://quantniti.jayadityadev.tech

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Synchronize Web Bundle to Android Assets
        run: python3 scripts/build_apk.py

      - name: Compile Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Locate & Package APK Output
        run: |
          mkdir -p build/apk
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build/apk/QuantNiti-debug.apk \;

      - name: Upload QuantNiti APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantNiti-Android-APK
          path: build/apk/QuantNiti-debug.apk
          retention-days: 30
