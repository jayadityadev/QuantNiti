name: Deploy QuantNiti Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/QuantNiti
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env exists with production settings
            if [ ! -f .env ]; then
              cat << 'EOF' > .env
PORT=8000
HOST=0.0.0.0
QUANTNITI_USE_VITE=1
WEB_CONCURRENCY=1
EOF
            fi

            # Ensure GEMINI_API_KEY is present in .env
            if ! grep -q "GEMINI_API_KEY" .env; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            fi

            docker compose down
            docker compose up -d --build --remove-orphans

            # Health check validation probe with retry loop and diagnostic dump on failure
            echo "Waiting for services to become healthy..."
            for i in $(seq 1 15); do
              echo "Health probe attempt $i/15..."
              if curl -s -f http://localhost:8000/api/v1/health; then
                echo "Health check succeeded!"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed after 75s! Diagnostic dump:"
            docker compose ps
            echo "=== quantniti-server logs ==="
            docker logs quantniti-server --tail 100
            echo "=== quantniti-proxy logs ==="
            docker logs quantniti-proxy --tail 50
            exit 1
